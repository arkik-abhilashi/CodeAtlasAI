services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeatlas}
      POSTGRES_USER: ${POSTGRES_USER:-codeatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeatlas-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codeatlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - codeatlas-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  codeatlas-postgres:
  codeatlas-redis:
